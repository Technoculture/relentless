[package]
name = "relentless"
version = "0.1.0"
edition = "2021"
description = "Compensatable task sequences for robotics"
license = "MIT"
readme = "README.md"

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
